function bindForm(){const fm=$("#cf");if(fm){fm.querySelectorAll("input:not(.hp)").forEach(i=>i.maxLength=120);fm.elements.message.maxLength=2000}

 const f=$("#cf");if(f)f.onsubmit=async e=>{
  e.preventDefault();const d=Object.fromEntries(new FormData(f)),m=$("#msg");let ok=true;
  f.querySelectorAll("input:not(.hp),textarea").forEach(el=>{const v=el.value.trim(),er=el.parentNode.querySelector(".err");
   let t="";if(!v)t="This field is required.";else if(el.type==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))t="Enter a valid email address.";else if(el.name==="message"&&v.length<10)t="Write at least 10 characters.";
   er.textContent=t;el.setAttribute("aria-invalid",!!t);if(t)ok=false});
  if(!ok)return;if(d.website)return;
  const show=(t)=>{m.className="show";m.innerHTML=t};
  if(CONFIG.formEndpoint){const b=$("#sb");b.disabled=true;b.textContent="Sending…";
   try{const r=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)});
    if(!r.ok)throw 0;show("Message sent. Thanks for reaching out.");f.reset()}catch(_){show("The message couldn’t be sent. Check your connection and try again.")}
   b.disabled=false;b.textContent="Send message";return}
  if(CONFIG.email){const body=d.message+"\n\n"+d.name+" ("+d.email+")",q=`subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(body)}`,u=`mailto:${CONFIG.email}?${q}`,g=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(CONFIG.email)}&su=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(body)}`;

  else show("Nothing was sent. Direct sending and email aren’t configured yet; the owner needs to set CONFIG.formEndpoint or CONFIG.email.");
 };

}

let HT,IO,HO,RES,FIRST=1,raf=0;
function initHero(){clearInterval(HT);HO&&HO.disconnect();const r=$("#ring");if(!r)return;const S=[...r.children],n=S.length;let c=0;
 $("#dots").innerHTML=S.map((_,i)=>`<button aria-label="Show project ${i+1}"></button>`).join("");const D=[...$("#dots").children];
 const go=i=>{c=(i+n)%n;S.forEach((s,k)=>{let o=k-c;if(o>n/2)o-=n;if(o<-n/2)o+=n;const a=Math.abs(o);
  s.style.transform=`translateX(calc(-50% + ${o*58}%)) translateZ(${-a*220}px) rotateY(${-o*34}deg)`;s.style.opacity=a>2?0:1-a*.3;s.style.zIndex=10-a;s.tabIndex=a?-1:0;s.classList.toggle("cur",!a);s.setAttribute("aria-label",(k+1)+" of "+n+": "+PROJECTS[k].name);s.style.pointerEvents=a>2?"none":"auto";
  s.onclick=e=>{if(k!==c){e.preventDefault();go(k)}}});D.forEach((d,k)=>{d.classList.toggle("on",k===c);d.onclick=()=>go(k)})};
 $("#pv").onclick=()=>go(c-1);$("#nx").onclick=()=>go(c+1);go(0);
 const rm=matchMedia("(prefers-reduced-motion:reduce)").matches,hero=r.closest(".hero"),play=()=>{clearInterval(HT);if(!rm&&!hero.classList.contains("paused"))HT=setInterval(()=>go(c+1),4500)};
 HO=new IntersectionObserver(([e])=>{hero.classList.toggle("paused",!e.isIntersecting);e.isIntersecting?play():clearInterval(HT)},{threshold:.05});HO.observe(hero);RES=play;
 const st=r.parentNode;let sx=null,mv=false,wl=0;st.style.touchAction="pan-y";st.tabIndex=0;
 st.ondragstart=e=>e.preventDefault();
 st.onpointerdown=e=>{sx=e.clientX;mv=false;clearInterval(HT)};
 st.onpointermove=e=>{if(sx===null)return;const dx=e.clientX-sx;if(Math.abs(dx)>60){mv=true;go(c+(dx<0?1:-1));sx=e.clientX}};
 st.onpointerup=st.onpointercancel=st.onpointerleave=()=>{sx=null};
 st.addEventListener("click",e=>{if(mv){e.preventDefault();e.stopPropagation();mv=false}},true);
 st.addEventListener("wheel",e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>8){e.preventDefault();const t=Date.now();if(t-wl>350){wl=t;go(c+(e.deltaX>0?1:-1))}}},{passive:false});
 st.onkeydown=e=>{if(e.key==="ArrowRight")go(c+1);if(e.key==="ArrowLeft")go(c-1)};
 st.onmouseenter=()=>clearInterval(HT);st.onmouseleave=play}

function reveal(){IO&&IO.disconnect();IO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");IO.unobserve(e.target)}}),{threshold:.12});
 document.querySelectorAll(".fp .card,.grid .card,.cap>div,.phil li,.tl>div,.eco a").forEach(el=>{el.classList.add("rv");IO.observe(el)})}
app.addEventListener("pointermove",e=>{const c=e.target.closest(".fp .card,.grid .card");if(!c||e.pointerType==="touch")return;const X=e.clientX,Y=e.clientY;cancelAnimationFrame(raf);
 raf=requestAnimationFrame(()=>{const r=c.getBoundingClientRect(),x=(X-r.left)/r.width,y=(Y-r.top)/r.height;c.style.setProperty("--rx",((.5-y)*10).toFixed(1)+"deg");c.style.setProperty("--ry",((x-.5)*12).toFixed(1)+"deg");c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%")})},{passive:true});
app.addEventListener("pointerleave",e=>{if(e.target.classList&&e.target.classList.contains("card")){e.target.style.setProperty("--rx","0deg");e.target.style.setProperty("--ry","0deg")}},true);
